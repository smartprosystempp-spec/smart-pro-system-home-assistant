name: Publish Smart Pro Managed Support image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare amd64 + aarch64 matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: '["amd64", "aarch64"]'
          image-name: smart-pro-managed-support

  build:
    name: Build ${{ matrix.arch }}
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./smart-pro-managed-support
          image: ${{ matrix.image }}
          image-tags: |
            3.19.2
            latest
          push: "true"
          version: 3.19.2

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish amd64 + aarch64 manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: '["amd64", "aarch64"]'
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: smart-pro-managed-support
          image-tags: |
            3.19.2
            latest
